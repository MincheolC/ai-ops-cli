interface:
  display_name: 'context-promotion-review'
  short_description: '커밋 직전 운영 지식 승격 후보를 검토하고 receipt를 기록합니다.'
  default_prompt: '$context-promotion-review를 사용해 현재 작업에서 core/project-local/global로 승격할 운영 지식 후보가 있는지 검토하고, 기존 context layer와 cross-check한 뒤 사용자 승인 전에는 파일을 수정하지 마세요. 결정 후 ai-ops context-promotion resolve를 실행하고 status로 receipt를 확인하세요.'
policy:
  allow_implicit_invocation: false

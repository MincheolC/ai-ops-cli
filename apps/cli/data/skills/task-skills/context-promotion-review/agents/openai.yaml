interface:
  display_name: 'context-promotion-review'
  short_description: '작업 커밋 직후 운영 지식 승격 후보를 검토하고 receipt를 기록합니다.'
  default_prompt: '$context-promotion-review를 사용해 hook이 전달한 Project root 안에서만 방금 완료된 HEAD 커밋을 검토하세요. 다른 repo, 이전 workspace, parent directory, 웹 검색, 외부 문서는 사용하지 말고, context layer 파일이 없으면 absent로 보고하세요. core/project-local/global/already-covered/no-promotion으로 분류하고, 사용자 승인 전에는 파일을 수정하지 마세요. 승인된 승격 수정 후에도 직접 커밋하지 말고 사용자 검사 대기 상태로 멈추며, 결정 후 ai-ops context-promotion resolve를 실행하고 status로 receipt를 확인하세요.'
policy:
  allow_implicit_invocation: false
